<div class="main-layout">
  <app-navbar></app-navbar>

  <div class="content-wrapper" [class.sidebar-collapsed]="sidebarCollapsed">
    <header class="main-header">
      <div class="header-context">
        <span class="context-rule" aria-hidden="true"></span>
        <div>
          <span class="context-label">Plataforma de información estratégica</span>
          <strong class="context-title">{{ currentPageTitle }}</strong>
        </div>
      </div>

      <div class="header-actions">
        <div class="session-status">
          <span class="status-dot" aria-hidden="true"></span>
          <span>Sesión activa</span>
        </div>

        <a routerLink="/perfil" class="user-info" aria-label="Abrir mi perfil">
          <span class="user-copy">
            <strong class="user-name">{{ nombreUsuario }}</strong>
            <span class="user-role">{{ nombreRol }}</span>
          </span>
          <span class="user-avatar" aria-hidden="true">{{ userInitials }}</span>
        </a>
      </div>
    </header>

    <main class="main-content">
      <router-outlet></router-outlet>
    </main>

    <footer class="main-footer">
      <p>© {{ currentYear }} IRS · Uso institucional</p>
      <p class="restricted-copy">
        <span aria-hidden="true"></span>
        Acceso restringido
      </p>
    </footer>
  </div>
</div>
