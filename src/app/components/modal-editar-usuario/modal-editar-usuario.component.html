
<div class="modal-overlay" *ngIf="showModal" (click)="closeModal()">
  <div class="modal-content" (click)="$event.stopPropagation()">
    <div class="modal-header">
      <h2>✏️ Editar Usuario - ID: {{ selectedUser?.userId }}</h2>
      <button class="btn-close-modal" (click)="closeModal()">✖</button>
    </div>

    <div class="modal-body" *ngIf="userLoading">
      <p class="cargando-usuario">Cargando información del usuario...</p>
    </div>

    <div class="modal-body" *ngIf="!userLoading && selectedUser">
      <div class="usuario-grid">

        <div class="usuario-section">
          <h3>👤 Información Personal</h3>

          <div class="usuario-field">
            <label>Nombre:</label>
            <input
              type="text"
              [(ngModel)]="selectedUser.name"
              placeholder="Ingrese nombre"
            />
          </div>

          <div class="usuario-field">
            <label>Apellido Paterno:</label>
            <input
              type="text"
              [(ngModel)]="selectedUser.firstSurname"
              placeholder="Ingrese apellido paterno"
            />
          </div>

          <div class="usuario-field">
            <label>Apellido Materno:</label>
            <input
              type="text"
              [(ngModel)]="selectedUser.secondSurname"
              placeholder="Ingrese apellido materno"
            />
          </div>

          <div class="usuario-field">
            <label>Alias:</label>
            <input
              type="text"
              [(ngModel)]="selectedUser.alias"
              placeholder="Ingrese alias"
            />
          </div>
        </div>


        <div class="usuario-section">
          <h3>🔐 Credenciales</h3>

          <div class="usuario-field">
            <label>Usuario:</label>
            <input
              type="text"
              [(ngModel)]="selectedUser.user"
              placeholder="Ingrese usuario"
            />
          </div>

          <div class="usuario-field">
            <label>Nueva Contraseña (opcional):</label>
            <div class="password-wrapper">
              <input
                [type]="showPassword ? 'text' : 'password'"
                [(ngModel)]="newPassword"
                placeholder="Dejar vacío para mantener contraseña actual"
              />
              <button
                type="button"
                class="btn-toggle-password"
                (click)="togglePassword()"
              >
                <i
                  [class]="
                    showPassword ? 'fi fi-rr-eye-crossed' : 'fi fi-rr-eye'
                  "
                ></i>
              </button>
            </div>
          </div>

          <div class="usuario-field">
            <label>Rol:</label>
            <select [(ngModel)]="selectedUser.roleId">
              <option [value]="undefined">Seleccione un rol</option>
              <option *ngFor="let role of roles" [value]="role.roleCategoryId">
                {{ role.roleName }}
              </option>
            </select>
          </div>

          <div class="usuario-field">
            <label>Estado:</label>
            <select [(ngModel)]="selectedUser.status">
              <option [value]="1">Activo</option>
              <option [value]="0">Inactivo</option>
            </select>
          </div>
        </div>


        <div class="usuario-section">
          <h3>📊 Información Adicional</h3>

          <div class="usuario-field readonly">
            <label>Fecha de Creación:</label>
            <input
              type="text"
              [value]="selectedUser.createdAt || 'N/A'"
              readonly
            />
          </div>

          <div class="usuario-field readonly">
            <label>Último Acceso:</label>
            <input
              type="text"
              [value]="selectedUser.lastAccess || 'Nunca'"
              readonly
            />
          </div>

          <div class="usuario-field readonly">
            <label>Intentos de Acceso:</label>
            <input
              type="text"
              [value]="selectedUser.attempt || 0"
              readonly
            />
          </div>

          <div class="usuario-field readonly">
            <label>IP:</label>
            <input
              type="text"
              [value]="selectedUser.ip || 'N/A'"
              readonly
            />
          </div>
        </div>
      </div>
    </div>

    <div class="modal-footer">
      <button class="btn-cancelar" (click)="closeModal()">Cancelar</button>
      <button
        class="btn-guardar"
        (click)="onSave()"
        [disabled]="userLoading"
      >
        💾 Guardar Cambios
      </button>
    </div>
  </div>
</div>
