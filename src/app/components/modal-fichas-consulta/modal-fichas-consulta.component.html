
<div class="modal-overlay" *ngIf="showModal" (click)="closeModal()">
  <div class="modal-content" (click)="$event.stopPropagation()">
    <div class="modal-header">
      <h2>
        📋 Ficha Informativa{{ readOnlyMode ? " (Solo Lectura)" : "" }} - ID:
        {{ selectedReport?.id }}
      </h2>
      <button class="btn-close-modal" (click)="closeModal()">✖</button>
    </div>

    <div class="modal-body" *ngIf="reportLoading">
      <p class="cargando-ficha">Cargando información de la ficha...</p>
    </div>

    <div
      class="modal-body"
      [class.solo-lectura]="readOnlyMode"
      *ngIf="!reportLoading && selectedReport"
    >
      <div class="ficha-grid">

        <div class="ficha-section">
          <h3>📍 Información General</h3>
          <div class="ficha-field">
            <label>Cédula:</label>
            <input
              type="text"
              [(ngModel)]="selectedReport.certificateNumber"
              placeholder="Ingrese cédula"
            />
          </div>
          <div class="ficha-field">
            <label>Delegación:</label>
            <input
              type="text"
              [(ngModel)]="selectedReport.delegation"
              placeholder="Ingrese delegación"
            />
          </div>
          <div class="ficha-field">
            <label>Municipio:</label>
            <input
              type="text"
              [(ngModel)]="selectedReport.municipality"
              placeholder="Ingrese municipio"
            />
          </div>
          <div class="ficha-field">
            <label>Lugar:</label>
            <input
              type="text"
              [(ngModel)]="selectedReport.place"
              placeholder="Ingrese lugar"
            />
          </div>
          <div class="ficha-field">
            <label>Dirección:</label>
            <input
              type="text"
              [(ngModel)]="selectedReport.address"
              placeholder="Ingrese dirección"
            />
          </div>
          <div class="ficha-field">
            <label>Latitud:</label>
            <input
              type="text"
              [(ngModel)]="selectedReport.latitude"
              placeholder="Ingrese latitud"
            />
          </div>
          <div class="ficha-field">
            <label>Longitud:</label>
            <input
              type="text"
              [(ngModel)]="selectedReport.longitude"
              placeholder="Ingrese longitud"
            />
          </div>
        </div>


        <div class="ficha-section">
          <h3>🕐 Fecha y Hora del Suceso</h3>
          <div class="ficha-field">
            <label>Fecha del Suceso:</label>
            <input type="date" [(ngModel)]="selectedReport.eventDate" />
          </div>
          <div class="ficha-field">
            <label>Hora Inicio:</label>
            <input
              type="time"
              [(ngModel)]="selectedReport.eventStartTime"
            />
          </div>
          <div class="ficha-field">
            <label>Hora Fin:</label>
            <input type="time" [(ngModel)]="selectedReport.eventEndTime" />
          </div>
        </div>


        <div class="ficha-section">
          <h3>🏷️ Clasificación</h3>
          <div class="ficha-field">
            <label>Sector:</label>
            <input
              type="text"
              [(ngModel)]="selectedReport.sector"
              placeholder="Ingrese sector"
            />
          </div>
          <div class="ficha-field">
            <label>Subsector:</label>
            <input
              type="text"
              [(ngModel)]="selectedReport.subsector"
              placeholder="Ingrese subsector"
            />
          </div>
          <div class="ficha-field">
            <label>Prioridad:</label>
            <input
              type="text"
              [(ngModel)]="selectedReport.priority"
              placeholder="Ingrese prioridad"
            />
          </div>
          <div class="ficha-field">
            <label>Condición:</label>
            <input
              type="text"
              [(ngModel)]="selectedReport.condition"
              placeholder="Ingrese condición"
            />
          </div>
          <div class="ficha-field">
            <label>Número de Asistentes:</label>
            <input
              type="number"
              [(ngModel)]="selectedReport.attendeeCount"
              placeholder="0"
            />
          </div>
        </div>


        <div class="ficha-section">
          <h3>📅 Elaboración y Recepción</h3>
          <div class="ficha-field">
            <label>Fecha Elaboración:</label>
            <input
              type="date"
              [(ngModel)]="selectedReport.creationDate"
            />
          </div>
          <div class="ficha-field">
            <label>Hora Elaboración:</label>
            <input
              type="time"
              [(ngModel)]="selectedReport.creationTime"
            />
          </div>
          <div class="ficha-field">
            <label>Fecha Recepción:</label>
            <input type="date" [(ngModel)]="selectedReport.receptionDate" />
          </div>
          <div class="ficha-field">
            <label>Hora Recepción:</label>
            <input type="time" [(ngModel)]="selectedReport.receptionTime" />
          </div>
          <div class="ficha-field">
            <label>Folio Interno:</label>
            <input
              type="text"
              [(ngModel)]="selectedReport.internalReference"
              placeholder="Ingrese folio"
            />
          </div>
        </div>


        <div class="ficha-section full-width">
          <h3>📝 Descripción</h3>
          <div class="ficha-field">
            <label>Información:</label>
            <textarea
              [(ngModel)]="selectedReport.information"
              rows="4"
              placeholder="Ingrese información"
            ></textarea>
          </div>
          <div class="ficha-field">
            <label>Asunto:</label>
            <textarea
              [(ngModel)]="selectedReport.subject"
              rows="4"
              placeholder="Ingrese asunto"
            ></textarea>
          </div>
          <div class="ficha-field">
            <label>Hechos:</label>
            <textarea
              [(ngModel)]="selectedReport.facts"
              rows="4"
              placeholder="Ingrese hechos"
            ></textarea>
          </div>
          <div class="ficha-field">
            <label>Acuerdos:</label>
            <textarea
              [(ngModel)]="selectedReport.agreements"
              rows="4"
              placeholder="Ingrese acuerdos"
            ></textarea>
          </div>
        </div>


        <div class="ficha-section">
          <h3>👥 Responsables</h3>
          <div class="ficha-field">
            <label>ID Usuario:</label>
            <input
              type="number"
              [(ngModel)]="selectedReport.userId"
              placeholder="0"
            />
          </div>
          <div class="ficha-field">
            <label>ID Informó:</label>
            <input
              type="number"
              [(ngModel)]="selectedReport.reporterId"
              placeholder="0"
            />
          </div>
          <div class="ficha-field">
            <label>ID Autorizó:</label>
            <input
              type="number"
              [(ngModel)]="selectedReport.authorizerId"
              placeholder="0"
            />
          </div>
          <div class="ficha-field">
            <label>Estado Actual:</label>
            <input
              type="number"
              [(ngModel)]="selectedReport.currentStatusId"
              placeholder="0"
            />
          </div>
          <div class="ficha-field">
            <label>Activo:</label>
            <input
              type="number"
              [(ngModel)]="selectedReport.active"
              placeholder="0"
            />
          </div>
          <div class="ficha-field">
            <label>Visto:</label>
            <input
              type="number"
              [(ngModel)]="selectedReport.seen"
              placeholder="0"
            />
          </div>
        </div>


        <div class="ficha-section">
          <h3>📌 Información Adicional</h3>
          <div class="ficha-field">
            <label>Motivo Cancelación:</label>
            <input
              type="text"
              [(ngModel)]="selectedReport.cancellationReason"
              placeholder="Ingrese motivo de cancelación"
            />
          </div>
          <div class="ficha-field">
            <label>ID Ficha Anterior:</label>
            <input
              type="number"
              [(ngModel)]="selectedReport.previousReportId"
              placeholder="0"
            />
          </div>
          <div class="ficha-field">
            <label>Fecha Validación:</label>
            <input
              type="datetime-local"
              [(ngModel)]="selectedReport.validationDate"
            />
          </div>
        </div>
      </div>
    </div>

    <div class="modal-footer">
      <button class="btn-cancelar" (click)="closeModal()">
        {{ readOnlyMode ? "Cerrar" : "Cancelar" }}
      </button>
      <button
        *ngIf="!readOnlyMode"
        class="btn-validar"
        (click)="onValidateAndSave()"
        [disabled]="reportLoading"
      >
        ✅ Validar y Guardar
      </button>
    </div>
  </div>
</div>
