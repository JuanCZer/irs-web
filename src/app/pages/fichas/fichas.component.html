<div class="fichas-container">
  <header class="irs-page-header" aria-labelledby="registrar-ficha-title">
    <div class="irs-page-header__copy">
      <p class="irs-page-header__eyebrow">Operación · gestión de fichas</p>
      <h1 id="registrar-ficha-title">
        <i class="fi fi-rr-add-document" aria-hidden="true"></i>
        Registrar ficha informativa
      </h1>
      <p>Captura la información del suceso y decide si deseas guardarla o validarla.</p>
    </div>
    <div class="irs-page-header__actions">
      <button type="button" class="btn-borrador irs-header-action irs-header-action--secondary" (click)="saveDraft()">
        <i class="fi fi-rr-disk"></i> Guardar como borrador
      </button>
      <button type="button" class="btn-validar irs-header-action irs-header-action--success" (click)="saveAndValidate()">
        <i class="fi fi-rr-check"></i> Guardar y validar ficha
      </button>
    </div>
  </header>

  <div class="estado-badge">
    <h3>Estado del registro <span class="badge-nuevo">Nuevo</span></h3>
  </div>

  <form class="ficha-form">

    <div class="seccion-card">
      <div class="form-row">
        <div class="form-group">
          <label for="estado">Estado: <span class="required">*</span></label>
          <select
            id="estado"
            [(ngModel)]="report.state"
            name="estado"
            class="form-control"
            required
          >
            <option value="" disabled selected>Seleccione un Estado</option>
            <option *ngFor="let state of mexicanStates" [value]="state">
              {{ state }}
            </option>
          </select>
        </div>

        <div class="form-group">
          <label for="lugar">Lugar: <span class="required">*</span></label>
          <input
            type="text"
            id="lugar"
            [(ngModel)]="report.place"
            name="lugar"
            class="form-control"
            placeholder="Ingrese el lugar"
            required
          />
        </div>
      </div>

      <div class="form-row">
        <div class="form-group">
          <label for="latitud">Latitud geográfica:</label>
          <input
            type="number"
            id="latitud"
            [(ngModel)]="report.latitude"
            name="latitud"
            (change)="updateMarkerFromInput()"
            class="form-control"
            step="0.000001"
            placeholder="Ej: 19.432608"
          />
        </div>

        <div class="form-group">
          <label for="longitud">Longitud geográfica:</label>
          <input
            type="number"
            id="longitud"
            [(ngModel)]="report.longitude"
            name="longitud"
            (change)="updateMarkerFromInput()"
            class="form-control"
            step="0.000001"
            placeholder="Ej: -99.133209"
          />
        </div>

        <div class="form-group">
          <label for="direccion">Dirección:</label>
          <input
            type="text"
            id="direccion"
            [(ngModel)]="report.address"
            name="direccion"
            class="form-control"
            placeholder="Ingrese la dirección completa"
          />
        </div>
      </div>


      <div class="mapa-container">
        <div id="map" class="mapa"></div>
        <small class="mapa-instruccion">
          <i class="fi fi-rr-info"></i>
          Haga clic en el mapa o arrastre el marcador para seleccionar la
          ubicación
        </small>
      </div>
    </div>


    <div class="seccion-card">
      <div class="form-row">
        <div class="form-group">
          <label for="sector">Sector: <span class="required">*</span></label>
          <select
            id="sector"
            name="sector"
            class="form-control"
            [(ngModel)]="report.sector"
            (ngModelChange)="onSectorChange($event)"
            required
          >
            <option value="" disabled selected>Seleccione una opción</option>
            <option *ngFor="let sector of sectors" [value]="sector.sector">
              {{ sector.sector }}
            </option>
          </select>
        </div>

        <div class="form-group">
          <label for="subsector">Subsector:</label>
          <select
            id="subsector"
            name="subsector"
            class="form-control"
            [(ngModel)]="report.subsector"
            [disabled]="subsectors.length === 0"
          >
            <option value="" disabled selected>Seleccione una opción</option>
            <option *ngFor="let subsector of subsectors" [value]="subsector.subsector">
              {{ subsector.subsector }}
            </option>
          </select>
        </div>
      </div>

      <div class="form-row">
        <div class="form-group">
          <label for="horaInicioSuceso">Hora inicial del suceso:</label>
          <input
            type="time"
            id="horaInicioSuceso"
            [(ngModel)]="report.eventStartTime"
            name="horaInicioSuceso"
            class="form-control"
          />
        </div>

        <div class="form-group">
          <label for="horaFinSuceso">Hora final del suceso:</label>
          <input
            type="time"
            id="horaFinSuceso"
            [(ngModel)]="report.eventEndTime"
            name="horaFinSuceso"
            class="form-control"
          />
        </div>

        <div class="form-group">
          <label for="fechaSuceso"
            >Fecha del suceso: <span class="required">*</span></label
          >
          <input
            type="date"
            id="fechaSuceso"
            [(ngModel)]="report.eventDate"
            name="fechaSuceso"
            class="form-control"
            required
          />
        </div>

        <div class="form-group">
          <label for="numeroAsistentes">Número de asistentes:</label>
          <input
            type="number"
            id="numeroAsistentes"
            [(ngModel)]="report.attendeeCount"
            name="numeroAsistentes"
            class="form-control"
            min="0"
            placeholder="0"
          />
        </div>
      </div>
    </div>


    <div class="seccion-card">
      <div class="form-row">
        <div class="form-group">
          <label for="prioridad"
            >Prioridad: <span class="required">*</span></label
          >
          <select
            id="prioridad"
            [(ngModel)]="report.priority"
            name="prioridad"
            class="form-control"
            required
          >
            <option value="" disabled selected>Seleccione una opción</option>
            <option *ngFor="let priority of priorities" [value]="priority.priority">
              {{ priority.priority }}
            </option>
          </select>
        </div>

        <div class="form-group">
          <label for="condicionEvento">Condición del evento:</label>
          <select
            id="condicionEvento"
            [(ngModel)]="report.eventCondition"
            name="condicionEvento"
            class="form-control"
          >
            <option value="" disabled selected>Seleccione una opción</option>
            <option
              *ngFor="let condition of eventConditions"
              [value]="condition.condition"
            >
              {{ condition.condition }}
            </option>
          </select>
        </div>

        <div class="form-group">
          <label for="informacion">Información:</label>
          <select
            id="informacion"
            [(ngModel)]="report.information"
            name="informacion"
            class="form-control"
          >
            <option value="" disabled selected>Seleccione una opción</option>
            <option *ngFor="let info of informationTypes" [value]="info.information">
              {{ info.information }}
            </option>
          </select>
        </div>
      </div>
    </div>


    <div class="seccion-card">
      <div class="form-group full-width">
        <label for="asunto">Asunto:</label>
        <textarea
          id="asunto"
          [(ngModel)]="report.subject"
          name="asunto"
          class="form-control textarea-field"
          rows="4"
          placeholder="Describa el asunto"
        ></textarea>
      </div>

      <div class="form-group full-width">
        <label for="hechos">Hechos:</label>
        <textarea
          id="hechos"
          [(ngModel)]="report.facts"
          name="hechos"
          class="form-control textarea-field"
          rows="6"
          placeholder="Describa los hechos ocurridos"
        ></textarea>
      </div>

      <div class="form-group full-width">
        <label for="acuerdos">Acuerdos:</label>
        <textarea
          id="acuerdos"
          [(ngModel)]="report.agreements"
          name="acuerdos"
          class="form-control textarea-field"
          rows="4"
          placeholder="Describa los acuerdos alcanzados"
        ></textarea>
      </div>
    </div>


    <div class="seccion-card seccion-recepcion">
      <div class="form-row">
        <div class="form-group">
          <label for="informo">Informó:</label>
          <select
            id="informo"
            [(ngModel)]="report.reporter"
            name="informo"
            class="form-control"
          >
            <option value="" disabled selected>Seleccione una opción</option>
            <option *ngFor="let informante of informants" [value]="informante">
              {{ informante }}
            </option>
          </select>
        </div>

        <div class="form-group">
          <label for="fechaRecepcion">Fecha recepción:</label>
          <input
            type="date"
            id="fechaRecepcion"
            [(ngModel)]="report.receptionDate"
            name="fechaRecepcion"
            class="form-control"
          />
        </div>

        <div class="form-group">
          <label for="horaRecepcion">Hora recepción:</label>
          <input
            type="time"
            id="horaRecepcion"
            [(ngModel)]="report.receptionTime"
            name="horaRecepcion"
            class="form-control"
          />
        </div>
      </div>
    </div>


    <div class="form-actions">
      <button type="button" class="btn-salir" (click)="exit()">
        <i class="fi fi-rr-sign-out-alt"></i> Salir
      </button>
    </div>


    <div class="message success" *ngIf="successMessage">
      <i class="fi fi-rr-check-circle"></i> {{ successMessage }}
    </div>
    <div class="message error" *ngIf="errorMessage">
      <i class="fi fi-rr-circle-exclamation-check"></i> {{ errorMessage }}
    </div>
  </form>
</div>
